name: Verify DeskGuard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: deskguard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned application and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Record actual source and environment
        run: |
          mkdir -p .evidence
          python tools/source_manifest.py
          python --version > .evidence/environment.txt
          uname -a >> .evidence/environment.txt
          python -m pip freeze >> .evidence/environment.txt
          python - <<'PY'
          import subprocess, zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().strip('\0').split('\0')
          with zipfile.ZipFile('.evidence/tested-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  z.write(name, name)
          PY
      - name: Compile application and execute backend regressions
        run: |
          set -euo pipefail
          python -m compileall -q deskguard tests tools
          node --check deskguard/static/app.js
          python -m pytest -q --junitxml=.evidence/tests.xml 2>&1 | tee .evidence/tests.log
      - name: Execute real HTTP browser workflow and capture screenshots
        run: |
          set -euo pipefail
          python tools/browser_test.py --output .evidence/browser 2>&1 | tee .evidence/browser.log
      - name: Preserve actual evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskguard-verification
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
