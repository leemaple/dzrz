name: Verify DeskGuard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: deskguard-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize exact reviewed source on first run
        if: hashFiles('bootstrap/part-1.b64') != ''
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          text = ''.join(Path(f'bootstrap/part-{i}.b64').read_text().strip() for i in range(1,6))
          packed = base64.b64decode(text, validate=True)
          assert len(packed) == 46140
          assert hashlib.sha256(packed).hexdigest() == 'e56a816b201a85cb67f3b48be729fa3967024f70c521cc6d5f0261cc44568c84'
          files = json.loads(lzma.decompress(packed))
          assert len(files) == 29
          roots = {'deskguard', 'tests', 'tools'}
          names = {'README.md', 'THIRD_PARTY_NOTICES.md', 'requirements.txt', 'requirements-dev.txt', 'run.sh', 'run.bat', '.gitignore'}
          for name, content in files.items():
              p = PurePosixPath(name)
              assert isinstance(content, str)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert p.parts[0] in roots or name in names
          for name, content in files.items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
          Path('run.sh').chmod(0o755)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deskguard tests tools README.md THIRD_PARTY_NOTICES.md requirements.txt requirements-dev.txt run.sh run.bat .gitignore
          git rm bootstrap/part-*.b64
          git commit -m 'feat: implement desktop configuration checks and verified remediation workflow'
          git push origin HEAD:main
      - name: Install pinned application and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Record actual source and environment
        run: |
          mkdir -p .evidence
          python tools/source_manifest.py --output .evidence
          python --version > .evidence/environment.txt
          uname -a >> .evidence/environment.txt
          python -m pip freeze >> .evidence/environment.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().strip('\0').split('\0')
          with zipfile.ZipFile('.evidence/tested-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  z.write(name, name)
          PY
      - name: Compile application and execute backend regressions
        run: |
          set -euo pipefail
          python -m compileall -q deskguard tests tools
          node --check deskguard/static/app.js
          python -m pytest -q --junitxml=.evidence/tests.xml 2>&1 | tee .evidence/tests.log
      - name: Execute real HTTP browser workflow and capture screenshots
        run: |
          set -euo pipefail
          python tools/browser_test.py --output .evidence/browser 2>&1 | tee .evidence/browser.log
      - name: Preserve actual evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskguard-verification
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
