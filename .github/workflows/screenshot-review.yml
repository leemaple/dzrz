name: Fix screenshot evidence visibility
on:
  push:
    paths: ['.github/workflows/screenshot-review.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply the exact two-line screenshot assertion change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('tools/browser_test.py')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '056a3a2fea9a2e6c0fab5e65d95197a78b793d562b7caae46bf01e45b5f88968'
          text = path.read_text()
          needle = '                expect(page.locator("#dialog-error")).to_be_visible()\n'
          assert text.count(needle) == 1
          replacement = needle + '                page.locator("#dialog-error").scroll_into_view_if_needed()\n                expect(page.locator("#dialog-error")).to_be_in_viewport()\n'
          text = text.replace(needle, replacement)
          assert hashlib.sha256(text.encode()).hexdigest() == 'f2ece2b5b0bdb2253b89e0f2fec88eda6e4f9b73df15c9b258e5b6fae61a963d'
          path.write_text(text)
          compile(text, str(path), 'exec')
          PY
          git rm .github/workflows/screenshot-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser_test.py
          git commit -m 'test: assert rejection alert is inside the captured viewport'
          git push origin HEAD:main
